[project]
name = "robot-imitation-lab"
version = "0.1.0"
description = "Imitation-learning robot policies on open data: train, evaluate, and compare against pretrained Hugging Face checkpoints on PushT."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Stanley Jacob" }]
dependencies = [
    "lerobot[pusht]",
    "gym-pusht",
    "torch>=2.6",
    "torchvision",
    "imageio[ffmpeg]",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
imitlab-train = "imitlab.train:main"
imitlab-eval = "imitlab.evaluate:main"
imitlab-figures = "imitlab.figures:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imitlab"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests cover the dependency-free modules (metrics, report), so CI can run
# them straight off the source tree without installing torch/lerobot.
pythonpath = ["src"]
